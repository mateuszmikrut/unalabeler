name: Build Docker Image and Create Release

on:
  push:
    branches:
      - main
    tags:
      # GitHub tag filters are globs; validate SemVer before building.
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.ref.outputs.build }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - name: Check main branch or semantic version tag
        id: ref
        shell: python {0}
        run: |
          import os
          import re

          # Official https://semver.org/ regex; allow an optional v prefix.
          semver = r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          ref = os.environ["GITHUB_REF"]
          is_tag = ref.startswith("refs/tags/")
          version = ref.removeprefix("refs/tags/").removeprefix("v")
          version_match = re.fullmatch(semver, version, flags=re.ASCII) if is_tag else None
          build = ref == "refs/heads/main" or version_match is not None
          prerelease = version_match is not None and version_match.group(4) is not None
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"build={str(build).lower()}\n")
              output.write(f"prerelease={str(prerelease).lower()}\n")
          if not build:
              print(f"Skipping non-release ref: {ref}")

  build-and-push:
    needs: validate-ref
    if: needs.validate-ref.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Docker's multi-platform image store
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Test built image without configuration
        shell: python {0}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          import os
          import subprocess

          digest = os.environ["IMAGE_DIGEST"]
          expected = (
              "ERROR - Sync failed: Missing mandatory environment variables: "
              "UL_UNIFI_HOST, UL_UNIFI_API_KEY"
          )
          for platform in ("linux/amd64", "linux/arm64"):
              print(f"Testing {digest} on {platform}", flush=True)
              result = subprocess.run(
                  ["docker", "run", "--rm", "--pull=never", "--network=none",
                   "--platform", platform, digest],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=30,
                  check=False,
              )
              print(result.stdout, end="", flush=True)
              if result.returncode != 1:
                  raise SystemExit(f"{platform}: expected exit code 1, got {result.returncode}")
              if expected not in result.stdout:
                  raise SystemExit(f"{platform}: expected log message: {expected}")

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Scan built image and summarize Grype results
        shell: python {0}
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GRYPE_REPORT_DIR: ${{ runner.temp }}/grype-reports
        run: |
          from collections import Counter
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import subprocess
          from urllib.parse import quote

          reports = Path(os.environ["GRYPE_REPORT_DIR"])
          reports.mkdir(parents=True, exist_ok=True)
          digest = os.environ["IMAGE_DIGEST"]
          severities = ("Critical", "High", "Medium", "Low", "Negligible", "Unknown")
          lines = [
              "## Grype vulnerability scan", "",
              f"Image digest: `{digest}`", "",
              f"Scanned at {datetime.now(timezone.utc).isoformat(timespec='seconds')}.", "",
              "Vulnerability matches per platform:", "",
              "| Platform | " + " | ".join(severities) + " | Total |",
              "| --- | " + " | ".join("---:" for _ in severities) + " | ---: |",
          ]
          versions = set()
          for arch in ("amd64", "arm64"):
              report_file = reports / f"grype-linux-{arch}.json"
              with report_file.open("w") as output:
                  subprocess.run(
                      [os.environ["GRYPE_CMD"], f"docker:{digest}",
                       "--platform", f"linux/{arch}", "--output", "json"],
                      stdout=output,
                      check=True,
                  )
              report = json.loads(report_file.read_text())
              versions.add(report["descriptor"]["version"])
              counts = Counter(
                  match["vulnerability"].get("severity") or "Unknown"
                  for match in report["matches"]
              )
              lines.append(
                  f"| linux/{arch} | " + " | ".join(str(counts[s]) for s in severities)
                  + f" | {len(report['matches'])} |"
              )
          lines.extend(["", f"Grype version: {', '.join(sorted(versions))}.", ""])
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              release_url = (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/download/{quote(os.environ['GITHUB_REF_NAME'], safe='')}"
              )
              for arch in ("amd64", "arm64"):
                  filename = f"grype-linux-{arch}.json"
                  lines.append(f"- [Full linux/{arch} JSON report]({release_url}/{filename})")
          else:
              lines.append("Full JSON reports are in the `grype-reports` workflow artifact.")
          summary = "\n".join(lines) + "\n"
          (reports / "grype-summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)

      - name: Save Grype reports
        uses: actions/upload-artifact@v4
        with:
          name: grype-reports
          path: ${{ runner.temp }}/grype-reports/
          if-no-files-found: error

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        shell: python {0}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          import os
          import subprocess

          # Push the tested image directly, without rebuilding it.
          for tag in os.environ["IMAGE_TAGS"].splitlines():
              subprocess.run(["docker", "tag", os.environ["IMAGE_DIGEST"], tag], check=True)
              subprocess.run(["docker", "push", tag], check=True)

  create-release:
    needs: [validate-ref, build-and-push]
    if: github.ref_type == 'tag' && needs.validate-ref.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      GRYPE_REPORT_DIR: ${{ runner.temp }}/grype-reports
    steps:
      - name: Download Grype reports
        uses: actions/download-artifact@v4
        with:
          name: grype-reports
          path: ${{ runner.temp }}/grype-reports/

      - name: Create or update GitHub release with image and Grype results
        shell: bash
        env:
          IS_PRERELEASE: ${{ needs.validate-ref.outputs.prerelease }}
          IMAGE_TAGS: ${{ needs.build-and-push.outputs.image-tags }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          EXISTING_NOTES_FILE: ${{ runner.temp }}/existing-release-notes.md
        run: |
          export RELEASE_EXISTS=false
          if gh release view "$GITHUB_REF_NAME" --json body --jq '.body // ""' > "$EXISTING_NOTES_FILE" 2>/dev/null; then
            export RELEASE_EXISTS=true
          fi

          python - <<'PY'
          import os
          from pathlib import Path
          import re
          from urllib.parse import quote

          # Use the exact published tag, including metadata-action's normalization.
          image = os.environ["IMAGE_TAGS"].splitlines()[0]
          repository = os.environ["GH_REPO"]
          package = quote(repository.split("/", 1)[1].lower(), safe="")
          package_url = f"{os.environ['GITHUB_SERVER_URL']}/{repository}/pkgs/container/{package}"
          section = (
              "<!-- docker-image -->\n"
              "## Docker image\n\n"
              f"[{image}]({package_url})\n\n"
              f"```bash\ndocker pull {image}\n```\n"
              "<!-- /docker-image -->\n"
          )
          grype_summary = (Path(os.environ["GRYPE_REPORT_DIR"]) / "grype-summary.md").read_text()
          section += f"\n<!-- grype-results -->\n{grype_summary}<!-- /grype-results -->\n"
          existing = ""
          if os.environ["RELEASE_EXISTS"] == "true":
              existing = Path(os.environ["EXISTING_NOTES_FILE"]).read_text()
              for marker in ("docker-image", "grype-results"):
                  existing = re.sub(
                      rf"<!-- {marker} -->.*?<!-- /{marker} -->\n*", "", existing, flags=re.S,
                  )
          notes = section + ("\n" + existing if existing else "")
          Path(os.environ["RELEASE_NOTES_FILE"]).write_text(notes)
          PY

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RELEASE_NOTES_FILE"
          else
            args=("$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --notes-file "$RELEASE_NOTES_FILE")
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

      - name: Attach Grype reports to release
        run: gh release upload "$GITHUB_REF_NAME" "$GRYPE_REPORT_DIR"/* --clobber
